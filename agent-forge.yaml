runtimes:
  codex:
    kind: codex

  claude:
    kind: claude

  qwen:
    kind: qwen
    options:
      authType: openai
      model: deepseek-reasoner
      env:
        OPENAI_BASE_URL: https://api.deepseek.com
        OPENAI_MODEL: deepseek-reasoner
        OPENAI_REASONING_EFFORT: high

threads:
  codex-runner:
    runtime: codex
    options:
      model: gpt-5.3-codex
      workingDirectory: .
      sandboxMode: danger-full-access

  qwen-runner:
    runtime: qwen
    options:
      cwd: .

agents:
  codex-agent:
    kind: prompt-template
    thread: codex-runner
    constants:
      template: "{{ prompt }}"

  qwen-agent:
    kind: prompt-template
    thread: qwen-runner
    constants:
      template: "{{ prompt }}"
