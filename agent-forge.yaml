runtimes:
  codex:
    kind: codex

  claude:
    kind: claude

  qwen:
    kind: qwen

  deepseek:
    kind: opencode
    options:
      config:
        model: deepseek/deepseek-chat
        small_model: deepseek/deepseek-chat
        enabled_providers:
          - deepseek
        provider:
          deepseek:
            name: DeepSeek
            options:
              baseURL: https://api.deepseek.com

threads:
  runner:
    runtime: codex
    options:
      model: gpt-5.3-codex
      workingDirectory: .
      sandboxMode: danger-full-access

  deepseek-runner:
    runtime: deepseek
    options:
      query:
        directory: .
