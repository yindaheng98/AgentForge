runtimes:
  codex:
    kind: codex

  claude:
    kind: claude

  cursor:
    kind: cursor
    options:
      model:
        id: composer-2.5
      local:
        cwd: .

  qwen:
    kind: qwen
    options:
      authType: openai
      model: deepseek-reasoner
      env:
        OPENAI_BASE_URL: https://api.deepseek.com
        OPENAI_MODEL: deepseek-reasoner
        OPENAI_REASONING_EFFORT: high

  opencode:
    kind: opencode
    options:
      config:
        model: deepseek/deepseek-reasoner
        small_model: deepseek/deepseek-reasoner
        enabled_providers:
          - deepseek
        provider:
          deepseek:
            name: DeepSeek
            options:
              baseURL: https://api.deepseek.com
            models:
              deepseek-chat:
                options:
                  reasoningEffort: high

threads:
  codex-runner:
    runtime: codex
    options:
      model: gpt-5.3-codex
      workingDirectory: .
      sandboxMode: danger-full-access

  cursor-runner:
    runtime: cursor

  opencode-runner:
    runtime: opencode
    options:
      query:
        directory: .

  qwen-runner:
    runtime: qwen
    options:
      cwd: .

agents:
  codex-agent:
    kind: prompt-template
    thread: codex-runner
    constants:
      template: "{{ prompt }}"

  cursor-agent:
    kind: prompt-template
    thread: cursor-runner
    constants:
      template: "{{ prompt }}"

  opencode-agent:
    kind: prompt-template
    thread: opencode-runner
    constants:
      template: "{{ prompt }}"

  qwen-agent:
    kind: prompt-template
    thread: qwen-runner
    constants:
      template: "{{ prompt }}"
